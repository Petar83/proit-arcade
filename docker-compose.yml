services:
  db:
    image: postgres:16-alpine
    container_name: proit-arcade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arcade
      POSTGRES_USER: arcade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - arcade_db:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcade -d arcade"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: proit-arcade-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - arcade_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: proit-arcade-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://arcade:${POSTGRES_PASSWORD:-change-me-now}@db:5432/arcade
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://arcade.pro-it.bg}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: proit-arcade-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ARCADE_PORT:-8088}:80"

volumes:
  arcade_db:
  arcade_redis:
