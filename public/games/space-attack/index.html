<!doctype html><html lang="bg"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#082f49"><title>Space Attack</title>
<link rel="stylesheet" href="/assets/common.css"><style>
canvas{width:min(94vw,64vh);height:min(125vw,76vh);touch-action:none}
</style></head><body class="game-page">
<div class="topbar"><a class="back" href="/">‹</a><div class="stat"><small>ТОЧКИ</small><strong id="score">0</strong></div></div>
<div class="game-stage"><canvas id="c" width="420" height="640"></canvas></div>
<p class="hint">Плъзгай кораба. Стрелбата е автоматична.</p>
<div class="overlay show" id="start"><div class="dialog"><h1>Space Attack</h1><p>Унищожи всички вълни.</p><button class="primary" id="go">Старт</button></div></div>
<div class="overlay" id="over"><div class="dialog"><h2>Край</h2><p>Резултат: <strong id="final">0</strong></p><button class="primary" id="again">Отново</button></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let ship,shots,enemies,stars,score,lastShot,lastSpawn,running,raf;
function reset(){
ship={x:210,y:570};shots=[];enemies=[];score=0;scoreEl.textContent=0;lastShot=0;lastSpawn=0;
stars=Array.from({length:70},()=>({x:Math.random()*420,y:Math.random()*640,s:Math.random()*2+1,v:Math.random()*1.8+.4}))
}
function spawn(){enemies.push({x:25+Math.random()*370,y:-25,r:16+Math.random()*7,v:1.3+Math.random()*1.5,hp:1})}
function draw(){
g.fillStyle='#020617';g.fillRect(0,0,420,640);
g.fillStyle='#fff';stars.forEach(s=>g.fillRect(s.x,s.y,s.s,s.s));
g.save();g.translate(ship.x,ship.y);g.fillStyle='#38bdf8';g.shadowBlur=18;g.shadowColor='#38bdf8';g.beginPath();g.moveTo(0,-26);g.lineTo(-18,18);g.lineTo(0,10);g.lineTo(18,18);g.closePath();g.fill();g.restore();g.shadowBlur=0;
g.fillStyle='#fde047';shots.forEach(s=>g.fillRect(s.x-2,s.y-10,4,14));
enemies.forEach(e=>{g.fillStyle='#f43f5e';g.shadowBlur=16;g.shadowColor='#f43f5e';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#fff';g.fillRect(e.x-7,e.y-3,4,4);g.fillRect(e.x+3,e.y-3,4,4)})
}
function loop(t){
if(!running)return;
stars.forEach(s=>{s.y+=s.v;if(s.y>640)s.y=0});
if(t-lastShot>260){shots.push({x:ship.x,y:ship.y-22});lastShot=t}
if(t-lastSpawn>650){spawn();lastSpawn=t}
shots.forEach(s=>s.y-=8);enemies.forEach(e=>e.y+=e.v);
for(const e of enemies)for(const s of shots){if(!s.dead&&!e.dead&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+5){s.dead=e.dead=true;score+=10;scoreEl.textContent=score;navigator.vibrate?.(12)}}
shots=shots.filter(s=>!s.dead&&s.y>-20);enemies=enemies.filter(e=>!e.dead&&e.y<680);
if(enemies.some(e=>Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+20||e.y>625))return finish();
draw();raf=requestAnimationFrame(loop)
}
function startGame(){cancelAnimationFrame(raf);reset();running=true;start.classList.remove('show');over.classList.remove('show');raf=requestAnimationFrame(loop)}
function finish(){running=false;final.textContent=score;over.classList.add('show');navigator.vibrate?.([80,50,80])}
function move(px){const r=c.getBoundingClientRect();ship.x=Math.max(24,Math.min(396,(px-r.left)*(420/r.width)))}
c.addEventListener('pointermove',e=>{if(running)move(e.clientX)});c.addEventListener('pointerdown',e=>move(e.clientX));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')ship.x-=24;if(e.key==='ArrowRight')ship.x+=24});
const scoreEl=document.getElementById('score');go.onclick=startGame;again.onclick=startGame;reset();draw();
</script></body></html>
